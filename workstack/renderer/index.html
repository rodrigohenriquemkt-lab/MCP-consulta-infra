<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Workstack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <span class="title">Em andamento</span>
    <span class="filters" id="filters"></span>
    <button id="watch" title="Observação de janelas">👁</button>
    <button id="quit" title="Fechar">×</button>
  </header>
  <input id="new" placeholder="+ nova atividade (Enter)" autocomplete="off">
  <main id="stack"></main>
  <script src="app.js"></script>
</body>
</html>
